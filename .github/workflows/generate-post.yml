name: Gerar Post O Código Águia

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 BRT — manhã
    - cron: '0 17 * * *'  # 14:00 BRT — tarde
    - cron: '0 23 * * *'  # 20:00 BRT — noite
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da geração manual'
        required: false
        default: 'Teste manual'

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar post com IA
        id: gerar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python .github/scripts/generate_post.py | tee /tmp/post_output.txt
          SLUG=$(grep "^Slug:" /tmp/post_output.txt | head -1 | sed 's/^Slug: //')
          TITLE=$(grep "^Título:" /tmp/post_output.txt | head -1 | sed 's/^Título: //')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Setup Node (para gerar sitemap)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar sitemap com novo post
        run: node scripts/generate-sitemap.mjs

      - name: Commit e push
        run: |
          git config user.name "Codigo Aguia Bot"
          git config user.email "blog-bot@ocodigoaguia.com.br"
          git add src/data/blog.ts public/sitemap.xml
          git diff --cached --quiet || git commit -m "blog: novo post automático $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Enviar email com link do post
        if: steps.gerar.outputs.slug != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_SLUG: ${{ steps.gerar.outputs.slug }}
          POST_TITLE: ${{ steps.gerar.outputs.title }}
        run: |
          POST_URL="https://ocodigoaguia.com.br/blog/${POST_SLUG}"
          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Blog Bot <blog@ocodigoaguia.com.br>\",
              \"to\": [\"fomedeaguia@gmail.com\"],
              \"subject\": \"📝 Novo post: ${POST_TITLE}\",
              \"html\": \"<h2>Novo artigo publicado no blog</h2><p><strong>${POST_TITLE}</strong></p><p><a href='${POST_URL}'>${POST_URL}</a></p><hr><p style='color:#999;font-size:12px'>Gerado automaticamente pelo Código Águia Bot</p>\"
            }"
